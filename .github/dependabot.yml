version: 2
updates:
  - package-ecosystem: npm
    directory: "/web-app"
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/web-app"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
