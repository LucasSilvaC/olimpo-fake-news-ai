schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Pausar e aguardar confirmação: ao concluir uma tarefa/grupo principal completo (ex: tarefa 1 inteira, e não subtarefas 1.1, 1.2 isoladamente), avisar o usuário e aguardar sua confirmação explícita antes de avançar para a próxima tarefa principal."
      - "Git Flow e Branches: criar branches seguindo o modelo Git Flow (ex: feat/<nome-da-tarefa>, fix/<nome-da-tarefa>), utilizando nomes claros e contingentes com o objetivo da tarefa."
      - "Commits semânticos: realizar commits seguindo boas práticas de Conventional Commits (ex: feat:, fix:, chore:, refactor:, test:)."
      - "Permissão de Push: é estritamente PROIBIDO realizar `git push` sem a autorização explícita do usuário."
  archive:
    guidance:
      - Summarize the archive outcome before finishing

