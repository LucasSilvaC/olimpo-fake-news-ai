<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Resumen de la arquitectura de Olimpo</title>
  <desc id="description">La interfaz de Next.js llama a acciones validadas que ejecutan casos de uso mediante interfaces de repositorio. Drizzle y Redis conectan los repositorios con los datos.</desc>
  <defs>
    <linearGradient id="accent" x1="70" y1="73" x2="1108" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="580" rx="28" fill="#F8FAFC"/>
  <text x="60" y="55" fill="#64748B" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FLUJO DE UNA ACCIÓN</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="91" width="1080" height="126" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="88" y="126" fill="#1D4ED8" font-size="13" font-weight="700" letter-spacing="1.4">BORDE WEB · NEXT.JS</text>
    <rect x="88" y="146" width="262" height="48" rx="12" fill="white" stroke="#DBEAFE"/>
    <text x="219" y="176" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Vistas y componentes</text>
    <path d="M360 170H433" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="447" y="146" width="262" height="48" rx="12" fill="white" stroke="#DBEAFE"/>
    <text x="578" y="176" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Acciones + validación</text>
    <path d="M719 170H792" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="806" y="146" width="304" height="48" rx="12" fill="white" stroke="#DBEAFE"/>
    <text x="958" y="176" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Route Handlers / SSE</text>

    <rect x="60" y="263" width="1080" height="115" rx="20" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="88" y="298" fill="#475569" font-size="13" font-weight="700" letter-spacing="1.4">APLICACIÓN Y DOMINIO</text>
    <rect x="88" y="318" width="458" height="42" rx="11" fill="white" stroke="#CBD5E1"/>
    <text x="317" y="345" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Casos de uso · entidades · reglas</text>
    <path d="M556 339H640" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="654" y="318" width="456" height="42" rx="11" fill="white" stroke="#CBD5E1"/>
    <text x="882" y="345" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Interfaces de repositorio</text>

    <rect x="60" y="424" width="1080" height="104" rx="20" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="88" y="459" fill="#B45309" font-size="13" font-weight="700" letter-spacing="1.4">INFRAESTRUCTURA</text>
    <rect x="88" y="478" width="458" height="34" rx="10" fill="white" stroke="#FDE68A"/>
    <text x="317" y="501" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Drizzle · PostgreSQL</text>
    <rect x="652" y="478" width="458" height="34" rx="10" fill="white" stroke="#FDE68A"/>
    <text x="881" y="501" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Redis · estado activo y Pub/Sub</text>
