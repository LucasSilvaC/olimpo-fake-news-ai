<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Pipeline de extração de notícias</title>
  <desc id="description">A URL passa por validação de segurança, extração de metadados e leitura editorial antes de ser normalizada como artigo.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="370" rx="28" fill="#F8FAFC"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="38" y="91" width="242" height="186" rx="22" fill="white" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="159" cy="146" r="29" fill="#DBEAFE"/><text x="159" y="154" fill="#2563EB" font-size="22" font-weight="700">01</text>
    <text x="159" y="207" fill="#0F172A" font-size="19" font-weight="700">Receber URL</text><text x="159" y="237" fill="#64748B" font-size="14">POST /api/news/extract</text>
    <path d="M292 184H341" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="355" y="91" width="242" height="186" rx="22" fill="white" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="476" cy="146" r="29" fill="#DBEAFE"/><text x="476" y="154" fill="#2563EB" font-size="22" font-weight="700">02</text>
    <text x="476" y="207" fill="#0F172A" font-size="19" font-weight="700">Validar destino</text><text x="476" y="237" fill="#64748B" font-size="14">protocolo · DNS · IP</text>
    <path d="M609 184H658" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="672" y="91" width="242" height="186" rx="22" fill="white" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="793" cy="146" r="29" fill="#DBEAFE"/><text x="793" y="154" fill="#2563EB" font-size="22" font-weight="700">03</text>
    <text x="793" y="207" fill="#0F172A" font-size="19" font-weight="700">Extrair conteúdo</text><text x="793" y="237" fill="#64748B" font-size="14">metadados · texto</text>
    <path d="M926 184H975" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="989" y="91" width="173" height="186" rx="22" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="1075" cy="146" r="29" fill="#FEF3C7"/><text x="1075" y="154" fill="#B45309" font-size="22" font-weight="700">04</text>
    <text x="1075" y="207" fill="#0F172A" font-size="19" font-weight="700">Normalizar</text><text x="1075" y="237" fill="#64748B" font-size="14">artigo tipado</text>
  </g>
</svg>
