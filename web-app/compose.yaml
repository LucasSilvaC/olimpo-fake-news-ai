services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-olimpo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  news-insights:
    build:
      context: ../model-engine
      dockerfile: Dockerfile
    environment:
      NEWS_INSIGHTS_HOST: 0.0.0.0
      NEWS_INSIGHTS_PORT: 8010
    ports:
      - "127.0.0.1:${NEWS_INSIGHTS_PORT:-8010}:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-olimpo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    container_name: olimpo
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-olimpo}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-development-auth-secret-change-in-production-min-32-chars}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      NEWS_INSIGHTS_SERVICE_URL: http://news-insights:8010
      NEWS_PREDICTION_SERVICE_URL: http://news-insights:8010
      NEWS_PREDICTION_TIMEOUT_MS: ${NEWS_PREDICTION_TIMEOUT_MS:-15000}
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next-dev:/app/.next
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      news-insights:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-node-modules:
  app-next-dev:
